<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greta Pasqualato</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;700&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: #ffffff;
            color: #2f3b4a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 30px;
        }

        .container {
            max-width: 720px;
            width: 100%;
            text-align: center;
        }

        .line {
            width: 80px;
            height: 3px;
            background: #5d7f95;
            margin: 0 auto 35px;
            border-radius: 2px;
        }

        h1 {
            font-size: 56px;
            font-weight: 300;
            letter-spacing: 2px;
            color: #2f3b4a;
        }

        h2 {
            margin-top: 12px;
            font-size: 22px;
            font-weight: 500;
            color: #5d7f95;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .tagline {
            margin-top: 28px;
            color: #6f7f8d;
            font-size: 18px;
            font-style: italic;
            line-height: 1.7;
            max-width: 560px;
            margin-left: auto;
            margin-right: auto;
        }

        .buttons {
            margin-top: 55px;
            display: flex;
            justify-content: center;
            gap: 18px;
            flex-wrap: wrap;
        }

        .button {
            display: inline-block;
            padding: 15px 34px;
            background: #5d7f95;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            transition: .25s ease;
            font-weight: 500;
        }

        .button:hover {
            background: #445f72;
            transform: translateY(-2px);
        }

        .info {
            margin-top: 45px;
            color: #7c8894;
            font-size: 16px;
            line-height: 2;
        }

        .info a {
            color: #5d7f95;
            text-decoration: none;
            font-weight: 500;
        }

        .info a:hover {
            text-decoration: underline;
        }

        footer {
            margin-top: 55px;
            color: #b0b8bf;
            font-size: 14px;
            letter-spacing: 1px;
        }

        @media (max-width:600px) {
            h1 {
                font-size: 42px;
            }

            h2 {
                font-size: 18px;
            }

            .tagline {
                font-size: 16px;
            }
        }
    </style>

</head>

<body>

    <div class="container">

        <div class="line"></div>

        <h1>Greta Pasqualato</h1>

        <h2>Event Project Manager</h2>

        <p class="tagline">
            I like planning great events... and staying long enough to enjoy them.
        </p>

        <div class="buttons">
            <a class="button" href="cv.pdf" download>Download CV</a>
        </div>

        <div class="info">
    <a href="https://www.linkedin.com/in/greta-pasqualato/" target="_blank">
        LinkedIn
    </a>
</div>

        <footer>
            © Greta Pasqualato
        </footer>

    </div>

</body>

</html>
