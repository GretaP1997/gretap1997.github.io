
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Greta Pasqualato</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: #ffffff;
            color: #2f3b4a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
        }

        .photo {
            width: 190px;
            height: 190px;
            border-radius: 50%;
            object-fit: cover;
            object-position: center 40%;
            border: 4px solid #5d7f95;
            display: block;
            margin: 0 auto 35px;
        }

        .line {
            width: 90px;
            height: 3px;
            background: #5d7f95;
            margin: 0 auto 35px;
            border-radius: 3px;
        }

        h1 {
            font-size: 64px;
            font-weight: 300;
            letter-spacing: 2px;
            color: #2f3b4a;
        }

        h2 {
            margin-top: 15px;
            font-size: 24px;
            font-weight: 500;
            color: #5d7f95;
            letter-spacing: 5px;
            text-transform: uppercase;
        }

        .line-bottom {
            width: 90px;
            height: 3px;
            background: #5d7f95;
            margin: 35px auto 45px;
            border-radius: 3px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 18px;
            flex-wrap: wrap;
        }

        .button {
            background: #5d7f95;
            color: white;
            text-decoration: none;
            padding: 16px 34px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 1px;
            transition: all .25s ease;
            display: inline-block;
            min-width: 180px;
        }

        .button:hover {
            background: #415d72;
            transform: translateY(-2px);
        }

        .button:focus-visible {
            outline: 3px solid #2f3b4a;
            outline-offset: 4px;
        }

        footer {
            margin-top: 60px;
            color: #b8c0c7;
            font-size: 14px;
            letter-spacing: 1px;
        }

        /* Pulsante fisso: sito viaggi */

        .travel-button {
            position: fixed;
            right: 24px;
            bottom: 24px;
            z-index: 1000;
            display: inline-flex;
            align-items: center;
            gap: 9px;
            background: #5d7f95;
            color: white;
            text-decoration: none;
            padding: 14px 21px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: .3px;
            box-shadow: 0 4px 14px rgba(47, 59, 74, .18);
            transition: all .25s ease;
        }

        .travel-button:hover {
            background: #415d72;
            transform: translateY(-3px);
            box-shadow: 0 7px 18px rgba(47, 59, 74, .23);
        }

        .travel-button:focus-visible {
            outline: 3px solid #2f3b4a;
            outline-offset: 4px;
        }

        .travel-arrow {
            font-size: 16px;
            line-height: 1;
        }

        @media (max-width: 768px) {
            .photo {
                width: 150px;
                height: 150px;
            }

            h1 {
                font-size: 42px;
            }

            h2 {
                font-size: 18px;
                letter-spacing: 3px;
            }

            .buttons {
                flex-direction: column;
                align-items: center;
            }

            .button {
                width: 220px;
            }

            .travel-button {
                right: 14px;
                bottom: 14px;
                padding: 12px 16px;
                font-size: 11px;
            }
        }
    </style>

</head>

<body>

    <main class="container">

        <img src="profile.JPG" alt="Greta Pasqualato" class="photo">

        <div class="line"></div>

        <h1>Greta Pasqualato</h1>

        <h2>Event Project Manager</h2>

        <div class="line-bottom"></div>

        <div class="buttons">

            <a class="button"
               href="cv.pdf"
               target="_blank"
               rel="noopener noreferrer">
                CV ITA
            </a>

            <a class="button"
               href="cv_eng.pdf"
               target="_blank"
               rel="noopener noreferrer">
                CV ENG
            </a>

            <a class="button"
               href="portfolio.pdf"
               target="_blank"
               rel="noopener noreferrer">
                PORTFOLIO
            </a>

        </div>

        <footer>
            © Greta Pasqualato
        </footer>

    </main>

    <!-- Collegamento al sito viaggi -->

    <a
        class="travel-button"
        href="https://gretagoesaround.github.io/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Quando non lavoro: visita il mio sito di viaggi"
    >
        Quando non lavoro
        <span class="travel-arrow">↗</span>
    </a>

</body>

</html>
