<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Greta Pasqualato</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;700&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: #ffffff;
            color: #2f3b4a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 30px;
        }

        .container {
            text-align: center;
            max-width: 700px;
            width: 100%;
        }

        .line {
            width: 80px;
            height: 3px;
            background: #5d7f95;
            margin: 0 auto 35px;
            border-radius: 2px;
        }

        h1 {
            font-size: 56px;
            font-weight: 300;
            letter-spacing: 2px;
            color: #2f3b4a;
        }

        h2 {
            margin-top: 14px;
            font-size: 22px;
            font-weight: 500;
            color: #5d7f95;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .tagline {
            margin-top: 30px;
            color: #6f7f8d;
            font-size: 18px;
            font-style: italic;
            line-height: 1.7;
            max-width: 550px;
            margin-left: auto;
            margin-right: auto;
        }

        .button {
            display: inline-block;
            margin-top: 55px;
            padding: 16px 38px;
            background: #5d7f95;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 500;
            transition: .25s ease;
        }

        .button:hover {
            background: #445f72;
            transform: translateY(-2px);
        }

        footer {
            margin-top: 60px;
            color: #9aa6b2;
            font-size: 14px;
            letter-spacing: 1px;
        }
    </style>

</head>

<body>

    <div class="container">

        <div class="line"></div>

        <h1>Greta Pasqualato</h1>

        <h2>Event Project Manager</h2>

        <p class="tagline">
            I like planning great events... and staying long enough to enjoy them.
        </p>

        <a class="button" href="cv.pdf" download>
            Download CV
        </a>

        <footer>
            © Greta Pasqualato
        </footer>

    </div>

</body>

</html>
