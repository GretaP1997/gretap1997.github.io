<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Greta Pasqualato</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: #ffffff;
            color: #2f3b4a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
        }

        .photo {
            width: 190px;
            height: 190px;
            border-radius: 50%;
            object-fit: cover;
            object-position: center top;
            border: 4px solid #5d7f95;
            display: block;
            margin: 0 auto 35px;
        }

        .line {
            width: 90px;
            height: 3px;
            background: #5d7f95;
            margin: 0 auto 35px;
            border-radius: 3px;
        }

        h1 {
            font-size: 64px;
            font-weight: 300;
            letter-spacing: 2px;
            color: #2f3b4a;
        }

        h2 {
            margin-top: 15px;
            font-size: 24px;
            font-weight: 500;
            color: #5d7f95;
            letter-spacing: 5px;
            text-transform: uppercase;
        }

        .tagline {
            margin: 35px auto;
            max-width: 650px;
            color: #6f7f8d;
            font-size: 22px;
            font-style: italic;
            line-height: 1.6;
        }

        .line-bottom {
            width: 90px;
            height: 3px;
            background: #5d7f95;
            margin: 0 auto 45px;
            border-radius: 3px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 18px;
            flex-wrap: wrap;
        }

        .button {
            background: #5d7f95;
            color: white;
            text-decoration: none;
            padding: 16px 34px;
            border-radius: 30px;
            font-size: 17px;
            font-weight: 500;
            transition: all .25s ease;
        }

        .button:hover {
            background: #415d72;
            transform: translateY(-2px);
        }

        footer {
            margin-top: 60px;
            color: #b8c0c7;
            font-size: 14px;
            letter-spacing: 1px;
        }

        @media (max-width:768px) {

            .photo {
                width: 150px;
                height: 150px;
            }

            h1 {
                font-size: 42px;
            }

            h2 {
                font-size: 18px;
                letter-spacing: 3px;
            }

            .tagline {
                font-size: 18px;
            }

            .buttons {
                flex-direction: column;
                align-items: center;
            }

            .button {
                width: 220px;
            }
        }
    </style>

</head>

<body>

    <div class="container">

        <img src="profile.jpg" alt="Greta Pasqualato" class="photo">

        <div class="line"></div>

        <h1>Greta Pasqualato</h1>

        <h2>Event Project Manager</h2>

        <p class="tagline">
            I like planning great events... and staying long enough to enjoy them.
        </p>

        <div class="line-bottom"></div>

        <div class="buttons">

            <a class="button" href="cv.pdf" download>
                Download CV
            </a>

            <a class="button" href="https://www.linkedin.com/in/greta-pasqualato/" target="_blank">
                LinkedIn
            </a>

        </div>

        <footer>
            © Greta Pasqualato
        </footer>

    </div>

</body>

</html>
